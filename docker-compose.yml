services:
  db:
    image: postgres:16-alpine
    container_name: edge-ai-ops-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edge_ai_ops}
      POSTGRES_USER: ${POSTGRES_USER:-edgeops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgeops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: edge-ai-ops-backend
    environment:
      APP_NAME: Edge AI Ops Platform API
      API_PREFIX: /api/v1
      ENGINE_MODE: ${ENGINE_MODE:-embedded}
      ENGINE_NAME: ${ENGINE_NAME:-python-vision-runtime}
      ENGINE_LANGUAGE: ${ENGINE_LANGUAGE:-python}
      ENGINE_TRANSPORT: ${ENGINE_TRANSPORT:-in-process}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-edgeops}:${POSTGRES_PASSWORD:-edgeops}@db:5432/${POSTGRES_DB:-edge_ai_ops}
      CORS_ORIGINS: "[\"http://localhost:${FRONTEND_PORT:-5173}\"]"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: edge-ai-ops-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}/api/v1
      VITE_WS_BASE_URL: ws://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
